name: Docker Images

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: neuralcart
          file: v5_singularity/backend/Dockerfile
          push: false
          tags: neuralcart/backend:latest

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: neuralcart
          file: v5_singularity/frontend/Dockerfile
          push: false
          tags: neuralcart/frontend:latest
