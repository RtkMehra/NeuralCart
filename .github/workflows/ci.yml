name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint backend
        run: pnpm --filter @neuralcart/v5-backend lint

      - name: Build backend
        run: pnpm --filter @neuralcart/v5-backend build

      - name: Lint frontend
        run: pnpm --filter @neuralcart/v5-frontend lint

      - name: Build frontend
        run: pnpm --filter @neuralcart/v5-frontend build

